[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab_lens"
version = "0.1.0"
description = "Lab Lens — Vision-Based Laboratory Equipment Verification & Spatial Compliance System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.24,<2.0",
    "torch==2.2.0+cpu",
    "torchvision==0.17.0+cpu",
    "ultralytics>=8.0.0",
    "psutil>=5.9.0"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0"
]

[project.scripts]
lab-lens = "lab_lens.__main__:main"
