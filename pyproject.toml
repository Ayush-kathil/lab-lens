[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab_lens"
version = "0.1.0"
description = "Lab Lens — Vision-Based Laboratory Equipment Verification & Spatial Compliance System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0"
]

[project.scripts]
lab-lens = "lab_lens.__main__:main"
